name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint every shell script (host + container side).
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh docker/*.sh

  # npm package: CLI unit tests + the tarball ships what the scripts need.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Package contents
        run: |
          npm pack --dry-run --json > pack.json
          for f in bin/eaenv.js scripts/lib/common.sh Dockerfile docker-compose.yml config/versions.env docker/entrypoint.sh .env.example; do
            grep -q "\"path\": \"$f\"" pack.json || { echo "missing from package: $f"; exit 1; }
          done
          if grep -q '"path": ".env"' pack.json; then echo ".env must never be published"; exit 1; fi

  # Dockerfile / compose defaults must match config/versions.env.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned versions are in sync
        run: scripts/check-versions.sh --verify-sync

  # Compose file is valid and the image builds for linux/amd64.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: PROJECT_DIR="$PWD" docker compose --env-file config/versions.env config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: expo-android-env:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test toolchain
        run: |
          docker run --rm expo-android-env:ci bash -c '
            set -e
            test "$(whoami)" = expo
            java -version
            node --version
            bun --version
            adb version
          '
