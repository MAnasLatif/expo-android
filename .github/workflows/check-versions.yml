# Weekly: compare config/versions.env with upstream releases (Android SDK,
# Node.js, Bun) and open/update a tracking issue when updates exist.
# Dependabot can't see these versions because they aren't package manifests.
name: Check upstream versions

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned vs latest
        id: check
        run: |
          scripts/check-versions.sh | tee report.txt
          # A row is outdated when "pinned X" differs from "latest Y".
          if awk '/pinned/ { if ($(NF-2) != $NF) found=1 } END { exit !found }' report.txt; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update tracking issue
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream dependency updates available"
          {
            echo "Automated weekly check found newer versions."
            echo
            echo '```text'
            cat report.txt
            echo '```'
            echo
            echo "See CONTRIBUTING.md → Updating dependency versions."
          } > body.md
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            # The "dependencies" label may not exist yet in a fresh fork.
            gh issue create --title "$title" --body-file body.md --label dependencies \
              || gh issue create --title "$title" --body-file body.md
          fi
