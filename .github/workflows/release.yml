# =============================================================================
# Release: push a version tag on ANY commit → publish `expoemu` to npm and create
# a GitHub Release. The tag decides the version (no need to edit package.json first).
#
#   git tag v0.1.0 && git push origin v0.1.0          → expoemu@0.1.0       (npm tag: latest)
#   git tag v0.2.0-beta.1 && git push origin v0.2.0-beta.1
#                                                     → expoemu@0.2.0-beta.1 (npm tag: beta)
#   v1.0.0-rc.2 → rc, v1.0.0-alpha.1 → alpha, v1.0.0-next.3 → next
#
#   Afterwards package.json on main is set to the tag's version automatically
#   (job sync-version), so it never needs editing by hand.
#
#   Users install a pre-release with:  npx expoemu@beta …   /  npm i -D expoemu@beta
#
# Authentication: npm Trusted Publishing (OIDC) — NO npm token or secret.
# GitHub issues a short-lived identity token to this workflow and npm accepts it
# because the package's trusted publisher is configured as:
#   MAnasLatif / expoemu / release.yml
# Provenance is attached automatically. See CONTRIBUTING.md → Releasing.
# =============================================================================
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC identity for npm trusted publishing (+ provenance)

# Never publish the same tag twice in parallel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs Node >= 22.14 and npm CLI >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # --- 1. Preconditions ---------------------------------------------------
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install -g npm@latest
          fi
          echo "npm $(npm --version)"

      # --- 2. Derive the package variant from the tag ------------------------------
      - name: Version and npm dist-tag from git tag
        id: v
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$tag' is not a version tag like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            pre="${version#*-}"; channel="${pre%%.*}"
            # npm dist-tags must not look like versions (e.g. v1.0.0-1 → next).
            [[ "$channel" =~ ^[0-9] ]] && channel=next
            prerelease=true
          else
            channel=latest; prerelease=false
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing expoemu@$version to npm dist-tag '$channel' (prerelease: $prerelease)"

      # npm versions are immutable. If this version is already on npm (e.g. the
      # very first release, published by hand before trusted publishing could be
      # configured, or a re-run), skip the npm step but still create the release.
      - name: Is this version already on npm?
        id: exists
        run: |
          if npm view "expoemu@${{ steps.v.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::warning::expoemu@${{ steps.v.outputs.version }} is already on npm — skipping publish, creating the GitHub Release only."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set package.json version (build only, not committed)
        run: npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version

      # --- 3. Verify -------------------------------------------------------------------
      - name: Unit tests
        run: npm test

      - name: Lint shell scripts
        run: shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh docker/*.sh server/*.sh

      - name: Pinned versions in sync
        run: scripts/check-versions.sh --verify-sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Shipped inside the package; the runner's Android SDK gets the pinned
      # build-tools/platform.
      - name: Build UI server APK
        run: server/build.sh

      - name: Build package tarball
        id: pack
        run: |
          file="$(npm pack --silent)"
          tar -tzf "$file" | grep -q 'package/scripts/lib/common.sh'
          tar -tzf "$file" | grep -qx 'package/server/dist/expoemu-server.apk' || { echo "::error::UI server APK missing from the package"; exit 1; }
          if tar -tzf "$file" | grep -qx 'package/.env'; then echo "::error::.env must never be published"; exit 1; fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # --- 4. Publish --------------------------------------------------------------------
      # No token: npm authenticates this run via OIDC (trusted publisher) and
      # attaches provenance automatically.
      - name: Publish to npm (trusted publishing)
        if: steps.exists.outputs.published == 'false'
        run: npm publish "${{ steps.pack.outputs.file }}" --access public --tag "${{ steps.v.outputs.channel }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists — nothing to do."
            exit 0
          fi
          args=(--verify-tag --generate-notes --title "expoemu ${{ steps.v.outputs.version }}")
          [ "${{ steps.v.outputs.prerelease }}" = true ] && args+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" "${args[@]}"

      - name: Summary
        run: |
          {
            if [ "${{ steps.exists.outputs.published }}" = true ]; then
              echo "### expoemu@${{ steps.v.outputs.version }} was already on npm — GitHub Release only"
            else
              echo "### Published expoemu@${{ steps.v.outputs.version }} (trusted publishing, with provenance)"
            fi
            echo ""
            echo "- npm dist-tag: \`${{ steps.v.outputs.channel }}\`"
            echo "- Install: \`npm i -D expoemu@${{ steps.v.outputs.version }}\`"
            echo "- https://www.npmjs.com/package/expoemu/v/${{ steps.v.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # After a successful release, the tag's version becomes the project version
  # on main: package.json "version" (only if newer) and, for stable versions,
  # the CHANGELOG "Unreleased" notes move under the new version heading.
  # Committed by github-actions[bot] as "chore(release): X.Y.Z".
  sync-version:
    name: Set package.json to the released version
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update package.json and CHANGELOG
        id: sync
        run: echo "result=$(node .github/scripts/sync-version.js "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Commit to main
        if: steps.sync.outputs.result == 'changed'
        run: |
          version="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): $version"
          # main may have moved since checkout: rebase and retry.
          for _ in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::Could not push the version bump to main"
          exit 1
