# Publish the `eaenv` package to npm when a version tag is pushed:
#   npm version patch   # bumps package.json and creates tag vX.Y.Z
#   git push --follow-tags
# Requires the repository secret NPM_TOKEN (npm automation token).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write   # npm provenance (links the package to this workflow run)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $pkg"; exit 1; }
      - run: npm test
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
